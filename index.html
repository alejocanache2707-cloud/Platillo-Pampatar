<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pampatar Paradise - Pedido del Producto</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            background: linear-gradient(135deg, #ecfeff 0%, #fef3c7 100%);
        }
        .glass {
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(10px);
        }
        .product-card {
            background: linear-gradient(180deg, #ffffff 0%, #f8fbfd 100%);
        }
        .step-btn {
            width: 38px;
            height: 38px;
            border-radius: 9999px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #e5f6f4;
            color: #0f766e;
            font-weight: 700;
            cursor: pointer;
            user-select: none;
            transition: transform 0.15s ease;
        }
        .step-btn:active {
            transform: scale(0.96);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-5xl glass rounded-[32px] shadow-2xl border border-white/60 overflow-hidden">
        <div class="grid md:grid-cols-2">
            <div class="p-6 md:p-10 product-card">
                <div class="mb-5">
                    <span class="inline-block bg-teal-100 text-teal-800 text-xs font-bold px-3 py-1 rounded-full">Producto</span>
                </div>

                <div class="overflow-hidden rounded-3xl shadow-lg border-4 border-white">
                    <img src="img/fs.jpg" alt="Fosforera de Pampatar" class="w-full h-[420px] object-cover">
                </div>

                <div class="mt-6 flex items-center justify-between gap-3">
                    <div>
                        <p class="text-sm text-gray-500 uppercase tracking-[0.2em]">Pampatar Paradise</p>
                        <h1 class="text-3xl font-extrabold text-slate-800 mt-1">Fosforera de Pampatar</h1>
                    </div>
                    <div class="text-right">
                        <p class="text-xs text-gray-500">Precio</p>
                        <p class="text-3xl font-black text-teal-700">$12</p>
                    </div>
                </div>

                <p class="mt-5 text-gray-700 leading-relaxed">
                    Un producto artesanal con sabor tradicional de la isla. Ideal para compartir, regalar o disfrutar en casa.
                </p>
            </div>

            <div class="bg-slate-900 text-white p-6 md:p-10">
                <div class="mb-6">
                    <p class="text-sm uppercase tracking-[0.25em] text-teal-300">Pedido directo</p>
                    <h2 class="mt-2 text-3xl font-black">Haz tu pedido</h2>
                </div>

                <form id="orderForm" class="space-y-5">
                    <div>
                        <label for="name" class="block text-sm mb-2 text-slate-200">Nombre</label>
                        <input id="name" type="text" placeholder="Tu nombre" class="w-full rounded-2xl border border-slate-700 bg-slate-800 px-4 py-3 text-white placeholder:text-slate-400 outline-none focus:border-teal-400" required>
                    </div>

                    <div>
                        <label for="phone" class="block text-sm mb-2 text-slate-200">WhatsApp</label>
                        <input id="phone" type="tel" placeholder="0412-1234567" class="w-full rounded-2xl border border-slate-700 bg-slate-800 px-4 py-3 text-white placeholder:text-slate-400 outline-none focus:border-teal-400" required>
                    </div>

                    <div>
                        <label class="block text-sm mb-2 text-slate-200">Cantidad</label>
                        <div class="flex items-center justify-between rounded-2xl border border-slate-700 bg-slate-800 px-3 py-2">
                            <button type="button" class="step-btn" data-action="decrease">−</button>
                            <span id="quantityValue" class="text-2xl font-bold min-w-[40px] text-center">1</span>
                            <button type="button" class="step-btn" data-action="increase">+</button>
                        </div>
                    </div>

                    <div>
                        <label for="notes" class="block text-sm mb-2 text-slate-200">Notas</label>
                        <textarea id="notes" rows="3" placeholder="Ej: Quiero entregas en..." class="w-full rounded-2xl border border-slate-700 bg-slate-800 px-4 py-3 text-white placeholder:text-slate-400 outline-none focus:border-teal-400"></textarea>
                    </div>

                    <div class="rounded-2xl border border-teal-500/30 bg-teal-500/10 p-4">
                        <div class="flex items-center justify-between">
                            <span class="text-sm text-slate-200">Subtotal</span>
                            <span id="subtotal" class="text-xl font-bold text-teal-300">$12</span>
                        </div>
                    </div>

                    <button type="submit" class="w-full rounded-2xl bg-gradient-to-r from-teal-500 to-cyan-500 text-white font-bold py-3.5 shadow-lg shadow-teal-500/20 transition hover:scale-[1.01]">
                        Enviar pedido por WhatsApp
                    </button>
                </form>
            </div>
        </div>
    </div>

    <script>
        const whatsappNumber = '584148483745';
        const price = 12;
        let quantity = 1;

        const quantityValue = document.getElementById('quantityValue');
        const subtotal = document.getElementById('subtotal');
        const form = document.getElementById('orderForm');

        function updateTotal() {
            quantityValue.textContent = quantity;
            subtotal.textContent = `$${price * quantity}`;
        }

        document.querySelector('[data-action="decrease"]').addEventListener('click', () => {
            if (quantity > 1) {
                quantity--;
                updateTotal();
            }
        });

        document.querySelector('[data-action="increase"]').addEventListener('click', () => {
            quantity++;
            updateTotal();
        });

        form.addEventListener('submit', function (event) {
            event.preventDefault();

            const name = document.getElementById('name').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const notes = document.getElementById('notes').value.trim();

            if (!name || !phone) {
                alert('Completa tu nombre y tu WhatsApp para continuar.');
                return;
            }

            const message = `Hola, quiero hacer este pedido:%0A%0A` +
                `Producto: Fosforera de Pampatar%0A` +
                `Cantidad: ${quantity}%0A` +
                `Total: $${price * quantity}%0A` +
                `Nombre: ${name}%0A` +
                `WhatsApp: ${phone}%0A` +
                `Notas: ${notes ? notes : 'Sin notas'}`;

            const url = `https://wa.me/${whatsappNumber}?text=${message}`;
            window.open(url, '_blank');
        });

        updateTotal();
    </script>
</body>
</html>
